[package]
name = "raw-files"
version = "0.11.0"
authors = ["Alvaro Kuolas <kuolas@gmail.com>"]
edition = "2024"
rust-version = "1.95"
description = "Pure-Rust camera RAW library: reads the previews, metadata and focus point of Nikon NEF and Sony ARW files and of camera JPEGs, with fuller RAW decoding planned"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kuolas/raw-files"
# Where the API documentation is read; docs.rs builds it from each release.
# No `homepage`: the repository is the project's home page.
documentation = "https://docs.rs/raw-files"
readme = "README.md"
keywords = ["raw", "nef", "arw", "exif", "photography"]
categories = ["multimedia::images", "parser-implementations"]
# What a crates.io package holds: the code, what the license requires and
# what docs.rs shows. Repository tooling and contributor docs stay in git.
# Cargo adds Cargo.toml and Cargo.lock itself.
include = [
    "/src",
    # The library's unit tests compile these three through `#[path]`
    # (`src/lib.rs`), so `cargo test --lib` works from the packaged crate.
    # The rest of tests/support serves the integration tests, which are not
    # published.
    "/tests/support/jpeg_builder.rs",
    "/tests/support/jpeg_stub.rs",
    "/tests/support/tiff_builder.rs",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/CHANGELOG.md",
]

# Code policy: docs/architecture-decisions/adr008-lints-and-panics.md
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with `--cfg fuzzing`, which compiles `src/fuzzing.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
