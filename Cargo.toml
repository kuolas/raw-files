[package]
name = "raw-files"
version = "0.1.0"
authors = ["Alvaro Kuolas <kuolas@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Pure-Rust camera RAW library: extracts embedded JPEG previews from Nikon NEF and Sony ARW files, with fuller RAW decoding planned"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kuolas/raw-files"
readme = "README.md"
keywords = ["raw", "nef", "arw", "camera", "photography"]
categories = ["multimedia::images", "parser-implementations"]
# Meant for crates.io, but not before the first release: a crate version
# can be yanked but never deleted. Remove this line when releasing.
publish = false
# What a crates.io package holds: the code, what the license requires and
# what docs.rs shows. Repository tooling and contributor docs stay in git.
# Cargo adds Cargo.toml and Cargo.lock itself.
include = [
    "/src",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/CHANGELOG.md",
]

# Code policy: docs/architecture-decisions/adr008-lints-and-panics.md
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
