# Dependabot — keeps the actions of .github/workflows/ current. Each action
# is pinned to a commit hash with its release tag in a comment beside it
# (ci.yml says why). Once a month Dependabot opens one pull request that
# moves every hash that has a newer release, and its comment with it.
#
# Its commit subject fails the commit-msg hook. With no prefix set,
# Dependabot copies the style of the recent subjects and writes, for
# example, "build(deps): Bump the actions group with 2 updates": a tag
# with a part in parentheses, the Conventional Commits form the hook
# refuses. So the "commits and hooks" check fails on every Dependabot pull
# request, and that is wanted: a rebase-merge keeps each subject as it
# stands, and the failure stops this one from reaching master. Before the
# merge, the commit is reworded on its branch in the house grammar, such
# as "ci: Update checkout to v7.0.1" (CONTRIBUTING.md §Commit messages),
# and force-pushed. A new major version still needs the node24 check that
# ci.yml describes.
#
# A commit-message prefix would not help: with "ci", Dependabot would
# write "ci: bump", whose lower-case summary the hook refuses too.
#
# Only the actions are watched. The library has no dependencies, and adding
# one is a decision of its own. The fuzz crate's one, libfuzzer-sys, stays
# at the version its lock file records.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
