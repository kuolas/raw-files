# CI — the checks from CONTRIBUTING.md §Code style and checks, run on every
# pull request. `hygiene` checks commits once; `build` runs the cargo checks on
# macOS, Linux and Windows (ADR007); `msrv` builds and tests with the oldest
# Rust the crate supports.
#
# Every pull request runs every job, docs-only ones included: the jobs are
# required checks on master, and a skipped workflow never reports, which
# would leave the pull request unmergeable.
#
# Actions must be node24-generation majors (node20 is deprecated on the hosted
# runners): checkout@v5 or later, and so on. Before adding or bumping one,
# check that the tag's action.yml says `using: node24`:
#   gh api repos/OWNER/REPO/contents/action.yml?ref=TAG --jq .content | base64 -d | grep using:
# Composite actions (such as dtolnay/rust-toolchain) have no node runtime.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: commits and hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Commit messages, and no merge commits
        # Runs .githooks/commit-msg itself over every commit of the PR, so CI
        # and the local hook enforce the same grammar.
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [ -n "$base" ] && [ -n "$head" ]; then
            rev_args=("$base..$head")
          else
            # workflow_dispatch has no PR range — check the recent tip instead.
            rev_args=(--max-count=20 HEAD)
          fi
          msg=$(mktemp)
          fail=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            git log -1 --format=%B "$sha" > "$msg"
            if ! .githooks/commit-msg "$msg"; then
              echo "::error::commit message rejected on $sha — see CONTRIBUTING §Commit messages"; fail=1
            fi
          done < <(git rev-list "${rev_args[@]}")
          # History is linear: no merge commit lands on master.
          if [ -n "$base" ] && [ -n "$head" ]; then
            merges=$(git rev-list --merges "$base..$head")
            if [ -n "$merges" ]; then
              echo "::error::merge commit(s) in the PR range — rebase onto master instead: $merges"; fail=1
            fi
          fi
          exit $fail

      # Git silently skips a hook that is not executable.
      - name: Hooks and scripts are executable
        run: |
          set -euo pipefail
          fail=0
          while read -r mode _ _ path; do
            if [ "$mode" != "100755" ]; then
              echo "::error file=$path::$path is committed $mode — must be 100755 to run"
              echo "  fix: git update-index --chmod=+x $path"
              fail=1
            fi
          done < <(git ls-files -s .githooks/ 'scripts/*.sh')
          exit $fail

  build:
    name: cargo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Swatinem/rust-cache@v2 declares `using: "node24"` (checked 2026-10-09).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # The real sample files of tests/samples.tsv, which the tests read when
      # they are present and skip otherwise (CONTRIBUTING.md §Code style and
      # checks). The files of the normal tier are about 1.1 GB; the large
      # tier is left out, since RAW_FILES_LARGE is not set here, and its
      # tests skip. The code that reads them is the same on every OS, so
      # only Linux downloads them; on macOS and Windows the directory does
      # not exist and those tests skip. It is under the runner's temp
      # directory rather than target/, which rust-cache manages. The cache
      # is keyed on the list, so a changed list starts from an empty
      # directory and downloads every file again. A pull request can
      # restore a cache saved on master, and samples.yml saves one there
      # under this key, so a pull request that leaves the list alone
      # downloads nothing.
      # actions/cache@v6 declares `using: 'node24'` (checked 2026-10-13).
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/raw-samples
          key: raw-samples-${{ hashFiles('tests/samples.tsv') }}
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/fetch-samples.sh
        env:
          RAW_FILES_SAMPLES: ${{ runner.temp }}/raw-samples
      - run: cargo test --workspace
        env:
          RAW_FILES_SAMPLES: ${{ runner.temp }}/raw-samples
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The modules compiled only for tests are documented too: the normal
      # doc build never sees them, and their broken links would go unnoticed.
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: --cfg test -D warnings
      # The fuzz entry points compile only with `--cfg fuzzing`, and the fuzz
      # crate is its own workspace, so none of the steps above compiles
      # them. Building them needs no nightly, only running them does; once
      # is enough, on Linux. The fuzz crate needs the flag too: the entry
      # points it calls do not exist without it.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg fuzzing
      - if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path fuzz/Cargo.toml
        env:
          RUSTFLAGS: --cfg fuzzing

  msrv:
    name: cargo (msrv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The oldest supported Rust: `rust-version` in Cargo.toml. Change both
      # together.
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
