# CI — the checks from CONTRIBUTING.md §Code style and checks, run on every
# pull request. `hygiene` checks commits once; `build` runs the cargo checks on
# macOS, Linux and Windows (ADR007); `msrv` builds and tests with the oldest
# Rust the crate supports; `semver` compares the public API with the newest
# version on crates.io.
#
# Every pull request runs every job, docs-only ones included: the jobs are
# required checks on master, and a skipped workflow never reports, which
# would leave the pull request unmergeable.
#
# Every action is pinned to a full commit hash, with its release tag in a
# comment on the same line. A tag can be moved to other code; a commit
# cannot. Dependabot (.github/dependabot.yml) opens one pull request a month
# that moves the hashes and their comments together. To pin by hand, look up
# the commit the tag names on the action's own repository:
#   gh api repos/OWNER/REPO/commits/TAG --jq .sha
# dtolnay/rust-toolchain has no release tags: it is pinned to a commit of its
# master branch, which needs the `toolchain` input. For a commit that no tag
# names, GitHub's docs say Dependabot moves the pin to the newest commit.
#
# Actions must be node24-generation majors (node20 is deprecated on the hosted
# runners): checkout v5 or later, and so on. Before adding or bumping one,
# check that the tag's action.yml says `using: node24`:
#   gh api repos/OWNER/REPO/contents/action.yml?ref=TAG --jq .content | base64 -d | grep using:
# Composite actions (such as dtolnay/rust-toolchain) have no node runtime.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: commits and hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Commit messages, and no merge commits
        # Runs .githooks/commit-msg itself over every commit of the PR, so CI
        # and the local hook enforce the same grammar. COMMIT_MSG_STORED tells
        # the hook the message is already stored, so its `#` lines are content.
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [ -n "$base" ] && [ -n "$head" ]; then
            rev_args=("$base..$head")
          else
            # workflow_dispatch has no PR range — check the recent tip instead.
            rev_args=(--max-count=20 HEAD)
          fi
          msg=$(mktemp)
          fail=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            git log -1 --format=%B "$sha" > "$msg"
            if ! COMMIT_MSG_STORED=1 .githooks/commit-msg "$msg"; then
              echo "::error::commit message rejected on $sha — see CONTRIBUTING §Commit messages"; fail=1
            fi
          done < <(git rev-list "${rev_args[@]}")
          # History is linear: no merge commit lands on master.
          if [ -n "$base" ] && [ -n "$head" ]; then
            merges=$(git rev-list --merges "$base..$head")
            if [ -n "$merges" ]; then
              echo "::error::merge commit(s) in the PR range — rebase onto master instead: $merges"; fail=1
            fi
          fi
          exit $fail

      # The pre-push cases of the hook tests run cargo fmt and cargo clippy on
      # a crate of one file, and skip without them.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Hook tests
        run: scripts/test-hooks.sh

      # A pinned shellcheck, checked against the SHA-256 of its release, not
      # the runner image's: versions differ in what they report, and an
      # image update would change the verdict with no change here. Raise
      # the version by hand, with its hash from the release page. With no
      # options it reports everything down to style notes, and each one
      # fails the step: fix it, or annotate the line with a
      # `# shellcheck disable=` comment that says why.
      - name: Shell scripts and hooks pass shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --proto '=https' -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check --quiet
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          shellcheck="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck"
          "$shellcheck" --version
          "$shellcheck" scripts/*.sh .githooks/*

      # Git silently skips a hook that is not executable.
      - name: Hooks and scripts are executable
        run: |
          set -euo pipefail
          fail=0
          while read -r mode _ _ path; do
            if [ "$mode" != "100755" ]; then
              echo "::error file=$path::$path is committed $mode — must be 100755 to run"
              echo "  fix: git update-index --chmod=+x $path"
              fail=1
            fi
          done < <(git ls-files -s .githooks/ 'scripts/*.sh')
          exit $fail

  build:
    name: cargo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Swatinem/rust-cache v2 declares `using: "node24"` (checked 2026-10-09).
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # The real sample files of tests/samples.tsv, which the tests read when
      # they are present and skip otherwise (docs/TESTING.md §The sample
      # files). The files of the normal tier are about 1.6 GB; the large
      # tier is left out, since RAW_FILES_LARGE is not set here, and its
      # tests skip. The code that reads them is the same on every OS, so
      # only Linux downloads them; on macOS and Windows the directory does
      # not exist and those tests skip. It is under the runner's temp
      # directory rather than target/, which rust-cache manages. The cache
      # is keyed on the list, so a changed list starts from an empty
      # directory and downloads every file again. A pull request can
      # restore a cache saved on master, and samples.yml saves one there
      # under this key, so a pull request that leaves the list alone
      # downloads nothing.
      # actions/cache v6 declares `using: 'node24'` (checked 2026-10-13).
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/raw-samples
          key: raw-samples-${{ hashFiles('tests/samples.tsv') }}
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/fetch-samples.sh
        env:
          RAW_FILES_SAMPLES: ${{ runner.temp }}/raw-samples
      # On Linux, RAW_FILES_REQUIRE_SAMPLES=1 makes a missing file of the
      # normal tier fail its test rather than skip. A wrong path or a cache
      # restored to another folder would otherwise pass the sample tests
      # without reading a file. macOS and Windows have no samples on
      # purpose, so it is empty there, which is off, and they skip.
      - run: cargo test --workspace
        env:
          RAW_FILES_SAMPLES: ${{ runner.temp }}/raw-samples
          RAW_FILES_REQUIRE_SAMPLES: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The modules compiled only for tests are documented too: the normal
      # doc build never sees them, and their broken links would go unnoticed.
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: --cfg test -D warnings
      # The private items again, without the test configuration: a link from
      # the normal docs to an item that only the tests build resolves above,
      # and fails here.
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # The fuzz entry points compile only with `--cfg fuzzing`, and the fuzz
      # crate is its own workspace, so none of the steps above compiles
      # them. Building them needs no nightly, only running them does; once
      # is enough, on Linux. The fuzz crate needs the flag too: the entry
      # points it calls do not exist without it.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg fuzzing
      - if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path fuzz/Cargo.toml
        env:
          RUSTFLAGS: --cfg fuzzing

  msrv:
    name: cargo (msrv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The oldest supported Rust: `rust-version` in Cargo.toml. Change both
      # together.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  semver:
    name: cargo (semver)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Compares the public API of this crate with the newest version
      # published on crates.io, so that a change that would break callers of
      # the last release is caught before it is merged. It catches many
      # breaking changes, such as a removed or renamed item, but not all: a
      # changed type or behavior is still for review to find. The verdict
      # depends on the version in Cargo.toml: while it is still the published
      # one, adding public items passes and removing one fails. The pull
      # request that makes the first breaking change of a release raises the
      # version, and before 1.0 that is the minor number (the versioning
      # promise in CHANGELOG.md).
      # There is no toolchain or rust-cache step: the action installs the
      # latest stable Rust itself, since the newest rustdoc has the fewest
      # false positives, and keeps the baseline's rustdoc in the Actions
      # cache. It takes no inputs: the defaults are right for one package
      # with no features, and the baseline moves by itself to each version
      # as it is published.
      # obi1kenobi/cargo-semver-checks-action v2 declares `using: 'node24'`
      # (checked 2026-10-15).
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
